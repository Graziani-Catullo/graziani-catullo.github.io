<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Graziani Catullo</title>
  <!-- Pagina di avvio del gestionale: logo sulla schermata Home e accesso ricordato. Nessun dato qui. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Graziani Catullo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1E4E87">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="icona-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7FB; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #attesa {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1E4E87;
    }
    #attesa img { width: 96px; height: 96px; border-radius: 22px; }
    #riserva {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center; background: #F4F7FB; color: #1F2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #riserva[hidden] { display: none; }
    #etichettaProva {
      position: fixed; z-index: 3; top: calc(6px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      padding: 2px 10px; border-radius: 999px; background: #B45309; color: #ffffff; pointer-events: none;
      font: 700 11px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.06em;
    }
    #etichettaProva[hidden] { display: none; }
    #riserva img { width: 96px; height: 96px; border-radius: 22px; }
    /* Notifiche: proposta in alto, una volta (si può rimandare di 7 giorni) */
    #proposta {
      position: fixed; z-index: 4; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top));
      max-width: 460px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 14px 16px;
      border-radius: 16px; background: #ffffff; color: #1F2937; box-shadow: 0 12px 40px rgba(16, 24, 40, 0.22);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #proposta[hidden] { display: none; }
    #proposta p { flex: 1 1 220px; margin: 0; }
    #proposta button {
      min-height: 44px; padding: 0 16px; border-radius: 12px; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }
    #attivaNotifiche { border: 1px solid #1E4E87; background: #1E4E87; color: #ffffff; }
    #nonOraNotifiche { border: 1px solid #1E4E87; background: #ffffff; color: #1E4E87; }
    #riserva a {
      display: inline-block; padding: 14px 24px; border-radius: 12px; background: #1E4E87; color: #ffffff;
      font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="etichettaProva" hidden>PROVA</div>
  <div id="attesa"><img src="icona-192.png" alt=""><span>Apertura del gestionale…</span></div>
  <div id="riserva" hidden>
    <img src="icona-192.png" alt="">
    <p>Il gestionale non si è aperto qui dentro.</p>
    <a id="apriDiretto" href="#">Apri il gestionale</a>
  </div>
  <div id="proposta" role="dialog" aria-label="Notifiche" hidden>
    <p>🔔 Vuoi ricevere su questo telefono gli avvisi del gestionale (usati da ritirare, impegni…)?</p>
    <button type="button" id="attivaNotifiche">Attiva</button>
    <button type="button" id="nonOraNotifiche">Non ora</button>
  </div>
  <iframe id="app" title="Gestionale Graziani Catullo" allow="clipboard-write; fullscreen"></iframe>
  <noscript>Per usare il gestionale serve JavaScript.</noscript>
  <script>
    (function () {
      // Indirizzi del gestionale (le pagine di Google Apps Script). ?app=prova apre il link di prova.
      var APP = {
        ufficiale: 'https://script.google.com/macros/s/AKfycbzkmo8fEHRGoVzENrDERt8sOh39GKiXPylHhJl73-kLFqK2Myxu6RBACzmYieanEGPC/exec',
        prova: 'https://script.google.com/macros/s/AKfycbwmq5ErHhxHAE1tCZhmy0ojIbnKeuKFb9wsjbguS8WLtxc1nS05WSa-TnSO0_aHPjnA/exec'
      };
      // Questa pagina apre il gestionale ufficiale (?app=prova solo per una prova al volo dal browser).
      // Per la prova dalla schermata Home c'è la pagina a parte /prova/ (l'icona della Home parte sempre da lì).
      var scelta = new URLSearchParams(location.search).get('app');
      var quale = scelta === 'prova' ? 'prova' : 'ufficiale';
      if (quale === 'prova') { document.getElementById('etichettaProva').hidden = false; }
      var CHIAVE = 'gestionale_chiave_' + quale;
      var cornice = document.getElementById('app');
      cornice.addEventListener('load', function () { document.getElementById('attesa').style.display = 'none'; });
      cornice.src = APP[quale];
      // Riserva: se entro 12 secondi il gestionale non si fa sentire (versione che non si lascia incorniciare,
      // rete lenta, telefono che blocca la cornice) si offre di aprirlo direttamente, invece di una pagina bianca.
      var vivo = false;
      document.getElementById('apriDiretto').href = APP[quale];
      document.getElementById('apriDiretto').target = '_top';
      setTimeout(function () { if (!vivo) { document.getElementById('riserva').hidden = false; } }, 12000);

      function leggi() { try { return localStorage.getItem(CHIAVE) || ''; } catch (e) { return ''; } }
      function scrivi(v) { try { if (v) { localStorage.setItem(CHIAVE, v); } else { localStorage.removeItem(CHIAVE); } } catch (e) { /* niente */ } }

      // La chiave d'accesso si dà SOLO al gestionale aperto qui dentro: il messaggio deve arrivare da una cornice di
      // Google Apps Script (…-script.googleusercontent.com) che sta DENTRO la nostra cornice.
      function dalNostroGestionale(evento) {
        if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(evento.origin)) { return false; }
        var w = evento.source;
        for (var i = 0; w && i < 10; i++) {
          if (w === cornice.contentWindow) { return true; }
          if (w === w.parent) { return false; }
          w = w.parent;
        }
        return false;
      }

      window.addEventListener('message', function (evento) {
        var d = evento.data;
        if (!d || typeof d !== 'object' || !dalNostroGestionale(evento)) { return; }
        vivo = true; // il gestionale si è aperto qui dentro
        document.getElementById('riserva').hidden = true;
        if (d.tipo === 'gestionale-chiedi-chiave') {
          evento.source.postMessage({ tipo: 'gestionale-chiave', chiave: leggi() }, evento.origin);
        } else if (d.tipo === 'gestionale-salva-chiave' && typeof d.chiave === 'string' && d.chiave.length >= 32 && d.chiave.length < 200) {
          scrivi(d.chiave);
        } else if (d.tipo === 'gestionale-cancella-chiave') {
          scrivi('');
        } else if (d.tipo === 'gestionale-notifiche-pronte') {
          // il gestionale è aperto e qualcuno ha fatto l'accesso: ora si può parlargli
          gestionale = { finestra: evento.source, origine: evento.origin };
          if (vaiDaNotifica) { manda({ tipo: 'gestionale-vai', vai: vaiDaNotifica }); vaiDaNotifica = null; }
          avviaNotifiche();
        }
      });

      // ---------- Notifiche sul telefono (Firebase Cloud Messaging) ----------
      // Configurazione PUBBLICA del progetto Firebase (non segreta: serve a iscrivere il telefono). La spedizione la fa
      // il gestionale con una chiave che sta solo nelle sue impostazioni. Nessun dato del gestionale passa di qui.
      var FIREBASE = {"apiKey": "AIzaSyCiazoTHLZVFXhibzx-_Ic79L_7QELs7V8", "authDomain": "gestionale-graziani-catullo.firebaseapp.com", "projectId": "gestionale-graziani-catullo", "storageBucket": "gestionale-graziani-catullo.firebasestorage.app", "messagingSenderId": "1019195034915", "appId": "1:1019195034915:web:5fe174a4fd541cefc09096"};
      var CHIAVE_WEB_PUSH = 'BCmKI4iux6BebI1TpI1upfUZlCRGj2nJPTbO4HACPWMYCs6JHea25WqcQ6l-bsBJVFL3TB5ggiL29qX_HmabMD0';
      var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
      var RIMANDA = 'gestionale_notifiche_rimandate';
      var gestionale = null;
      // Toccando una notifica si arriva qui con ?vai=["veicolo",{"id":"V-00012"}]: si passa al gestionale dopo l'accesso
      var vaiDaNotifica = null;
      try {
        var vai = new URLSearchParams(location.search).get('vai');
        if (vai) {
          vaiDaNotifica = JSON.parse(vai);
          history.replaceState(null, '', location.pathname); // ricaricando non si riapre
        }
      } catch (e) { vaiDaNotifica = null; }

      function manda(messaggio) {
        if (gestionale) { try { gestionale.finestra.postMessage(messaggio, gestionale.origine); } catch (e) { /* niente */ } }
      }
      function supportate() {
        return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      }
      function rimandate() {
        try { return Date.now() - Number(localStorage.getItem(RIMANDA) || 0) < 7 * 86400000; } catch (e) { return false; }
      }
      function avviaNotifiche() {
        if (!supportate()) { return; } // iPhone: solo aprendo dall'icona sulla Home (iOS 16.4 o più recente)
        if (Notification.permission === 'granted') { prendiCodice(); return; }
        if (Notification.permission === 'default' && !rimandate()) { document.getElementById('proposta').hidden = false; }
      }
      document.getElementById('attivaNotifiche').addEventListener('click', function () {
        document.getElementById('proposta').hidden = true;
        Notification.requestPermission().then(function (permesso) { if (permesso === 'granted') { prendiCodice(); } });
      });
      document.getElementById('nonOraNotifiche').addEventListener('click', function () {
        document.getElementById('proposta').hidden = true;
        try { localStorage.setItem(RIMANDA, String(Date.now())); } catch (e) { /* niente */ }
      });

      function caricaScript(src) {
        return new Promise(function (fatto, errore) {
          var s = document.createElement('script');
          s.src = src; s.onload = fatto; s.onerror = errore;
          document.head.appendChild(s);
        });
      }
      function descrizione() {
        var ua = navigator.userAgent;
        var cosa = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' :
          /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Dispositivo';
        var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        return cosa + (standalone ? ' (app sulla Home)' : ' (browser)');
      }
      var codicePreso = null;
      function prendiCodice() {
        if (codicePreso) { codicePreso.then(passaCodice); return; }
        codicePreso = caricaScript(SDK + 'firebase-app-compat.js')
          .then(function () { return caricaScript(SDK + 'firebase-messaging-compat.js'); })
          .then(function () { return navigator.serviceWorker.register('/firebase-messaging-sw.js'); })
          .then(function (registrazione) {
            if (!firebase.apps.length) { firebase.initializeApp(FIREBASE); }
            var messaggi = firebase.messaging();
            // app aperta: niente avviso del telefono, ma la campanella si aggiorna subito
            messaggi.onMessage(function () { manda({ tipo: 'gestionale-aggiorna-campanella' }); });
            return messaggi.getToken({ vapidKey: CHIAVE_WEB_PUSH, serviceWorkerRegistration: registrazione });
          });
        codicePreso.then(passaCodice).catch(function (e) { codicePreso = null; console.error('Notifiche: ' + e); });
      }
      function passaCodice(codice) {
        if (codice) { manda({ tipo: 'gestionale-dispositivo', codice: codice, dispositivo: descrizione(), pagina: location.origin + location.pathname }); }
      }
    })();
  </script>
</body>
</html>
